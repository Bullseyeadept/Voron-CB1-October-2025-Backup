# ============================================================================
#  EBB_TEST - self-test for the EBBCan toolhead board
#  Install: Mainsail > Machine > create ebb_test.cfg with this content,
#           add  [include ebb_test.cfg]  to printer.cfg, Save & Restart.
#  Run:     EBB_TEST            (fans plugged in, ~2 min)
#           EBB_LED_TEST        (LEDs only, ~25 s)
#           EBB_TEST EXTRUDE=1  (also heats to 240C and extrudes 5 mm)
#  Needs [respond] (already in your mainsail.cfg).
#  Results print in the console as [PASS] / [FAIL] / [CHECK] (= look yourself).
#  Emergency stop at any time: M112
# ============================================================================

[gcode_macro EBB_TEST]
description: Self-test of the EBBCan toolhead board, prints PASS/FAIL per item
gcode:
    {% set extrude = params.EXTRUDE|default(0)|int %}
    RESPOND MSG="EBB TEST: starting. Keep hands clear of the toolhead. M112 = emergency stop."
    M106 S0
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=1
    G4 P2500
    _EBB_T_BASIC
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    QUERY_PROBE
    _EBB_T_PROBE
    # --- LEDs (separate macro so it can also be run alone)
    EBB_LED_TEST
    # --- part cooling fan (no speed sensor, so you watch it)
    RESPOND MSG="EBB TEST: get ready to check the PART COOLING FAN (blower inside the toolhead - feel for air from the ducts under the nozzle). Starting in 5 s..."
    G4 P5000
    RESPOND MSG="EBB TEST [CHECK] Part fan ON for 10 s: air blowing under the nozzle?"
    M106 S255
    G4 P10000
    M106 S0
    RESPOND MSG="EBB TEST [CHECK] Part fan OFF: did the airflow stop within a few seconds?"
    G4 P5000
    # --- heater + temperature sensor + hotend fan
    _EBB_T_HEAT_START
    M104 S75
    G4 P25000
    _EBB_T_HEAT_CHECK
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=65
    G4 P5000
    _EBB_T_HOTEND_FAN
    {% if extrude %}
        RESPOND MSG="EBB TEST: heating to 240C for the extruder motor test..."
        M109 S240
        M83
        G1 E5 F300
        RESPOND MSG="EBB TEST [CHECK] Extruder: did ~5 mm of filament come out / gears turn?"
    {% endif %}
    M104 S0
    # --- accelerometer last: if it is broken this command errors and stops the macro
    RESPOND MSG="EBB TEST: reading accelerometer (an error here = accelerometer link FAIL)..."
    ACCELEROMETER_QUERY
    RESPOND MSG="EBB TEST: finished. Heater is off; hotend fan runs until below 60C. Scroll up for results."

[gcode_macro EBB_LED_TEST]
description: Stealthburner LED test - logo LED, then each nozzle LED, then all colors (about 25 s)
gcode:
    RESPOND MSG="LED TEST: watch the toolhead front: the LOGO (top) and the 2 NOZZLE LEDs (bottom). Starting in 5 s..."
    SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=0
    G4 P5000
    RESPOND MSG="LED TEST [CHECK] Logo LED only, RED (3 s)"
    SET_LED LED=sb_leds RED=1 GREEN=0 BLUE=0 WHITE=0 INDEX=1
    G4 P3000
    SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=0 INDEX=1
    RESPOND MSG="LED TEST [CHECK] Nozzle LED 1 only, WHITE (3 s)"
    SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=1 INDEX=2
    G4 P3000
    SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=0 INDEX=2
    RESPOND MSG="LED TEST [CHECK] Nozzle LED 2 only, WHITE (3 s)"
    SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=1 INDEX=3
    G4 P3000
    SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=0 INDEX=3
    RESPOND MSG="LED TEST [CHECK] All 3 RED (3 s)"
    SET_LED LED=sb_leds RED=1 GREEN=0 BLUE=0 WHITE=0
    G4 P3000
    RESPOND MSG="LED TEST [CHECK] All 3 GREEN (3 s)"
    SET_LED LED=sb_leds RED=0 GREEN=1 BLUE=0 WHITE=0
    G4 P3000
    RESPOND MSG="LED TEST [CHECK] All 3 BLUE (3 s)"
    SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=1 WHITE=0
    G4 P3000
    SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=0
    RESPOND MSG="LED TEST: done. Dead LED = that one stayed dark. Wrong colors (e.g. red shows green) = color_order setting, not damage."

[gcode_macro _EBB_T_BASIC]
gcode:
    {% set m = printer['mcu EBBCan'] %}
    {action_respond_info("EBB TEST [PASS] EBBCan connected (firmware %s)" % (m.mcu_version))}
    # temperature sensor at rest
    {% set t = printer.extruder.temperature %}
    {% if t > 5 and t < 60 %}
        {action_respond_info("EBB TEST [PASS] Hotend temp sensor reads %.1fC (plausible)" % t)}
    {% else %}
        {action_respond_info("EBB TEST [FAIL?] Hotend temp sensor reads %.1fC (expected room temp; ignore if the hotend is still warm)" % t)}
    {% endif %}
    # extruder driver chip (TMC2209) - fault flags
    {% set d = printer['tmc2209 extruder'].drv_status %}
    {% if d is none %}
        {action_respond_info("EBB TEST [CHECK] Extruder driver: no status yet. Run DUMP_TMC STEPPER=extruder - a register list means it is fine")}
    {% else %}
        {% set bad = [] %}
        {% for f in ['ot', 'otpw', 's2ga', 's2gb', 's2vsa', 's2vsb'] %}
            {% if d[f] %}{% set _ = bad.append(f) %}{% endif %}
        {% endfor %}
        {% if bad %}
            {action_respond_info("EBB TEST [FAIL] Extruder driver reports faults: %s (s2g = short to ground, ot = overheat)" % (bad|join(', ')))}
        {% else %}
            {action_respond_info("EBB TEST [PASS] Extruder driver (TMC2209) responding, no fault flags")}
        {% endif %}
    {% endif %}
    # hotend fan should be OFF when cold; spinning anyway = shorted fan port
    {% set hf = printer['heater_fan hotend_fan'] %}
    {% if hf.speed == 0 and hf.rpm is not none and hf.rpm > 500 %}
        {action_respond_info("EBB TEST [FAIL] Hotend fan spins (%d RPM) while commanded OFF: fan port switch likely shorted" % hf.rpm)}
    {% elif hf.speed == 0 %}
        {action_respond_info("EBB TEST [PASS] Hotend fan off while cold, as it should be")}
    {% endif %}

[gcode_macro _EBB_T_PROBE]
gcode:
    {% if printer.probe.last_query %}
        {action_respond_info("EBB TEST [FAIL?] TAP probe reads TRIGGERED with nozzle free (check TAP wiring/sensor)")}
    {% else %}
        {action_respond_info("EBB TEST [PASS] TAP probe reads open. Optional: push nozzle up and run QUERY_PROBE, should say TRIGGERED")}
    {% endif %}

[gcode_macro _EBB_T_HEAT_START]
gcode:
    SET_GCODE_VARIABLE MACRO=_EBB_T_HEAT_CHECK VARIABLE=t0 VALUE={printer.extruder.temperature}
    {action_respond_info("EBB TEST: heating hotend to 75C (25 s check)...")}

[gcode_macro _EBB_T_HEAT_CHECK]
variable_t0: 0
gcode:
    {% set rise = printer.extruder.temperature - t0 %}
    {% if rise >= 15 %}
        {action_respond_info("EBB TEST [PASS] Heater + temp sensor: rose %.0fC in 25 s" % rise)}
    {% else %}
        M104 S0
        {action_raise_error("EBB TEST [FAIL] Heater: only rose %.1fC in 25 s. Heater, its output, or the temp sensor is faulty. Test stopped, heater off." % rise)}
    {% endif %}

[gcode_macro _EBB_T_HOTEND_FAN]
gcode:
    {% set hf = printer['heater_fan hotend_fan'] %}
    {% if hf.rpm is none %}
        {action_respond_info("EBB TEST [CHECK] Hotend fan: no speed reading. Is it spinning? (tach wire may be unplugged)")}
    {% elif hf.rpm > 1000 %}
        {action_respond_info("EBB TEST [PASS] Hotend fan spinning at %d RPM" % hf.rpm)}
    {% else %}
        {action_respond_info("EBB TEST [CHECK] Hotend fan commanded ON, speed sensor reads %d RPM. If the fan is visibly spinning, it is fine: the speed (tach) wire just is not connected" % hf.rpm)}
    {% endif %}
